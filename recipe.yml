name: 'Varbase AI Media Base'
description: 'Generate images and SVGs with AI from the Media Library on Varbase 11, with the AI Media module: a "Generate image with AI" tab right after Image and a "Generate SVG with AI" tab right after SVG Image, saving into those media types, with the permission granted to the editorial roles. No custom PHP or shell code.'
type: 'Varbase AI'
# Needs default AI providers for text_to_image (images) and chat (SVG);
# varbase_ai_base sets them up.
install:
  - ai
  - svg_image
  - ai_media
config:
  strict: false
  import:
    ai_media: '*'
  actions:
    # Generated images are saved as Image media, generated SVGs as SVG Image.
    ai_media.settings:
      setAiMediaTypes:
        image: image
        svg: svg_image
    # CKEditor's Insert Media in Full HTML: add SVG Image, keep the rest.
    # content_format allows every type.
    filter.format.full_html:
      allowMediaEmbedTypes: [svg_image]
    # Who may generate: the roles that already add images. Generating spends
    # provider credit, so it has a permission of its own.
    user.role.content_editor:
      grantPermissions:
        - 'generate media with ai'
        - 'create image media'
        - 'create svg_image media'
    user.role.content_admin:
      grantPermissions:
        - 'generate media with ai'
        - 'create image media'
        - 'create svg_image media'
    # Site admins also run the AI Media settings; providers stay with Drupal AI.
    user.role.site_admin:
      grantPermissions:
        - 'administer ai media'
        - 'generate media with ai'
        - 'create image media'
        - 'create svg_image media'
